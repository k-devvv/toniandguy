<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="New salons in Sobha Arcadia and Prestige Tech Forest, Bengaluru."><title>TONI&amp;GUY Bengaluru</title><link rel="stylesheet" href="/site.css"><style>[hidden]{display:none!important}
/* Black, ivory and champagne gold. Photography carries the page; Bodoni Moda sets the voice, Inter does the work.
   Dark first. A light (ivory) theme follows the viewer's setting. Content is left aligned; motion is limited to the hero film and hover reveals. */
:root{
  --bg:#09090A; --bg2:#0F0F11; --surf:#151518; --surf2:#1E1E22; --ink:#F3EDE1; --mute:#A39C8F; --rule:rgba(243,237,225,.14);
  --gold:#C9A862; --gold-text:#D8BC7E; --gold-soft:rgba(201,168,98,.14); --on-gold:#110D04;
  --plat:#AEBBC8; --plat-text:#C2CDD8; --plat-soft:rgba(174,187,200,.14);
  --ok:#5CC49A; --warn:#E0A44A; --concept:#A996F0; --bad:#F08076;
  --acc:var(--gold); --acc-text:var(--gold-text); --acc-soft:var(--gold-soft);
  --display:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif; --sans:'Inter','Helvetica Neue',Arial,sans-serif;
  --gut:clamp(18px,4vw,56px); color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#F6F1E7; --bg2:#EFE8DA; --surf:#FBF8F1; --surf2:#E8E0CF; --ink:#16130D; --mute:#625B4C; --rule:rgba(22,19,13,.16);
  --gold:#B38F47; --gold-text:#6F5115; --gold-soft:rgba(179,143,71,.16); --on-gold:#120D03;
  --plat:#6D7F92; --plat-text:#3F5266; --plat-soft:rgba(109,127,146,.16);
  --ok:#1F7A55; --warn:#8A5A06; --concept:#5B45B0; --bad:#B3362B; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F6F1E7; --bg2:#EFE8DA; --surf:#FBF8F1; --surf2:#E8E0CF; --ink:#16130D; --mute:#625B4C; --rule:rgba(22,19,13,.16);
  --gold:#B38F47; --gold-text:#6F5115; --gold-soft:rgba(179,143,71,.16); --on-gold:#120D03;
  --plat:#6D7F92; --plat-text:#3F5266; --plat-soft:rgba(109,127,146,.16);
  --ok:#1F7A55; --warn:#8A5A06; --concept:#5B45B0; --bad:#B3362B; color-scheme:light}
body[data-loc="p"]{--acc:var(--plat);--acc-text:var(--plat-text);--acc-soft:var(--plat-soft)}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--acc-text);outline-offset:3px}
.wrap{padding-inline:var(--gut);max-width:1360px;margin-inline:auto;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;letter-spacing:-.012em;line-height:1.04;margin:0;text-wrap:balance}
h1{font-size:clamp(44px,8vw,116px);font-weight:500}
h2{font-size:clamp(34px,5.4vw,76px)}
h3{font-size:clamp(22px,2.4vw,32px);line-height:1.15}
h4{font-size:19px}
p{margin:0;text-wrap:pretty}
.it{font-style:italic;font-weight:400}
.lead{font-size:clamp(17px,1.5vw,21px);line-height:1.6;color:var(--mute);max-width:56ch}
.mute{color:var(--mute)}.small{font-size:14px}
.cap{font:600 11.5px/1.2 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--acc-text)}
.gold{color:var(--acc-text)}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid{display:grid;gap:clamp(16px,2.4vw,32px)}
.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}
@media(min-width:780px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1100px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.blk{padding-block:clamp(64px,9vw,132px)}
.blk.tight{padding-block:clamp(48px,6vw,88px)}
.alt{background:var(--bg2)}
.rule{height:1px;background:var(--rule);border:0;margin:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 28px;background:var(--gold);color:var(--on-gold);border:1px solid var(--gold);font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;transition:background .25s,color .25s,border-color .25s}
.btn:hover{background:transparent;color:var(--acc-text)}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--rule);border-color:color-mix(in srgb,var(--ink) 38%,transparent)}
.btn.sec:hover{border-color:var(--gold);color:var(--acc-text)}
.btn.sm{min-height:42px;padding:0 20px;font-size:11px}
.btn.on-photo{background:rgba(9,9,10,.35);color:#F3EDE1;border-color:rgba(243,237,225,.55);backdrop-filter:blur(6px)}
.btn.on-photo:hover{background:#F3EDE1;color:#111;border-color:#F3EDE1}
.link{font:600 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--acc-text);border-bottom:1px solid currentColor;padding-bottom:6px;align-self:flex-start}

/* header */
.hd{position:fixed;top:0;left:0;right:0;z-index:50;transition:background .35s,border-color .35s;border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top,0px)}
.hd .wrap{display:flex;align-items:center;gap:28px;height:76px}
.hd.solid,.hd.pg{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-color:var(--rule)}
.hd:not(.solid):not(.pg){color:#F3EDE1}
.logo{font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:.06em;text-decoration:none;white-space:nowrap;display:flex;align-items:baseline;gap:12px}
.logo i{font:500 10.5px var(--sans);letter-spacing:.3em;text-transform:uppercase;opacity:.7}
.nav{display:none;gap:26px;margin-inline:auto}
.nav a{font:500 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;opacity:.8;padding:8px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current]{opacity:1;border-color:var(--gold)}
.hd .bk{margin-left:auto}
.menu-b{background:none;border:0;font:500 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;padding:10px 0}
@media(min-width:1040px){.nav{display:flex}.hd .bk{margin-left:0}.menu-b{display:none}}
.sheet{position:fixed;inset:76px 0 0 0;z-index:49;background:var(--bg);padding:24px var(--gut) 120px;display:flex;flex-direction:column;overflow:auto}
.sheet a{font-family:var(--display);font-size:34px;text-decoration:none;padding:14px 0;border-bottom:1px solid var(--rule)}

/* photo base */
.ph{position:relative;overflow:hidden;background:var(--surf2);margin:0}
.ph img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.06) brightness(.94);transition:filter .7s,transform 1.4s cubic-bezier(.2,.7,.2,1)}
.ph.col img,.ph:hover img{filter:none}
.ph:hover img{transform:scale(1.035)}
.ph.nz:hover img{transform:none}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;padding:48px 20px 18px;background:linear-gradient(transparent,rgba(5,5,6,.82));color:#F3EDE1;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase}
.r-34{aspect-ratio:3/4}.r-45{aspect-ratio:4/5}.r-32{aspect-ratio:3/2}.r-169{aspect-ratio:16/9}.r-11{aspect-ratio:1}
.ph a.cover{position:absolute;inset:0}

/* hero film */
.hero{position:relative;min-height:100svh;background:#000;color:#F3EDE1;overflow:hidden;display:flex}
.film{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:2px;background:#000}
.reel{position:relative;overflow:hidden}
.reel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.5s ease;filter:grayscale(1) contrast(1.1) brightness(.78)}
.reel img.on{opacity:1;animation:kb 8s ease-out forwards}
@keyframes kb{from{transform:scale(1.03)}to{transform:scale(1.12)}}
@media(max-width:820px){.film{grid-template-columns:1fr}.reel:not(:nth-child(2)){display:none}}
.vig{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.05) 26%,rgba(0,0,0,.18) 52%,rgba(0,0,0,.9) 100%),linear-gradient(90deg,rgba(0,0,0,.55),transparent 62%)}
@media(max-width:779px){.vig{background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.35) 30%,rgba(0,0,0,.78) 58%,rgba(0,0,0,.95) 100%)}}
@media(min-width:780px){.vig{background:linear-gradient(180deg,rgba(0,0,0,.62) 0%,rgba(0,0,0,.05) 26%,rgba(0,0,0,.25) 52%,rgba(0,0,0,.9) 100%),linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.25) 55%,transparent 75%)}}
.hero-in{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(18px,3vh,32px);padding-top:120px;padding-bottom:clamp(28px,5vh,56px);width:100%}
.hero h1{max-width:13ch;font-size:clamp(46px,8.4vw,128px);line-height:.98}
.hero .sub{font-size:clamp(16px,1.6vw,21px);max-width:46ch;color:rgba(243,237,225,.82)}
.hero .scene{font-family:var(--display);font-style:italic;font-size:clamp(26px,3.4vw,46px);color:var(--gold-text)}
.hero .scene b{font:600 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;font-style:normal;color:rgba(243,237,225,.7);margin-right:14px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
.bars{display:flex;gap:6px;max-width:420px}
.bars i{flex:1;height:2px;background:rgba(243,237,225,.25);position:relative;overflow:hidden}
.bars i.on::after,.bars i.done::after{content:"";position:absolute;inset:0;background:var(--gold)}
.bars i.on::after{transform-origin:left;animation:fill var(--d,6s) linear forwards}
@keyframes fill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.heroside{position:absolute;right:var(--gut);bottom:clamp(28px,5vh,56px);z-index:2;display:none;flex-direction:column;gap:10px;align-items:flex-end}
@media(min-width:1000px){.heroside{display:flex}}
.heroside a{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:16px 22px;border:1px solid rgba(243,237,225,.4);background:rgba(9,9,10,.4);backdrop-filter:blur(8px);min-width:270px;transition:border-color .3s,background .3s}
.heroside a:hover{border-color:var(--gold);background:rgba(9,9,10,.7)}
.heroside a b{font-family:var(--display);font-weight:500;font-size:22px}
.heroside a span{font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:rgba(243,237,225,.7)}

/* marquee */
.marq{overflow:hidden;border-block:1px solid var(--rule);background:var(--bg)}
.marq div{display:flex;gap:56px;white-space:nowrap;padding:22px 0;width:max-content;animation:mq 46s linear infinite}
.marq span{font-family:var(--display);font-style:italic;font-size:clamp(24px,3vw,38px);display:flex;align-items:center;gap:56px}
.marq span::after{content:"";width:7px;height:7px;transform:rotate(45deg);background:var(--gold)}
@keyframes mq{to{transform:translateX(-50%)}}

/* statement */
.statement{font-family:var(--display);font-size:clamp(28px,4.2vw,60px);line-height:1.12;letter-spacing:-.01em;font-weight:400;max-width:24ch}
.statement em{color:var(--acc-text)}

/* two salons */
.doors{display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.doors{grid-template-columns:repeat(2,minmax(0,1fr))}}
.door{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:clamp(440px,70vh,720px);padding:clamp(24px,3.4vw,52px);color:#F3EDE1;text-decoration:none;overflow:hidden;isolation:isolate}
.door img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(1) brightness(.72);transition:transform 1.6s cubic-bezier(.2,.7,.2,1),filter .8s}
.door::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(transparent 30%,rgba(5,5,6,.92))}
.door:hover img{transform:scale(1.05);filter:grayscale(.2) brightness(.8)}
.door h3{font-size:clamp(34px,4.2vw,60px)}
.door .m{font:500 11.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:rgba(243,237,225,.7);display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.door .go{margin-top:22px;align-self:flex-start;font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid var(--gold);padding-bottom:6px;color:var(--gold-text)}
.door.p .go{border-color:var(--plat);color:var(--plat-text)}

/* tiles */
.tiles{display:grid;gap:clamp(10px,1.4vw,18px);grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:780px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1180px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:block;aspect-ratio:3/4;overflow:hidden;text-decoration:none;color:#F3EDE1}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.85);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .6s}
.tile:hover img{transform:scale(1.06);filter:none}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(5,5,6,.9))}
.tile div{position:absolute;left:0;right:0;bottom:0;padding:18px 18px 20px;z-index:2;display:flex;flex-direction:column;gap:6px}
.tile b{font-family:var(--display);font-weight:500;font-size:clamp(19px,1.8vw,25px);line-height:1.15}
.tile span{font:500 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold-text)}

/* horizontal scroller */
.hs{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:18px;margin-inline:calc(var(--gut) * -1);padding-inline:var(--gut);scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
.hs>*{flex:0 0 min(78vw,360px);scroll-snap-align:start}
.hs .tile{aspect-ratio:4/5}

/* section head */
.sh{display:flex;flex-wrap:wrap;gap:18px 40px;justify-content:space-between;align-items:flex-end;margin-bottom:clamp(28px,4vw,56px)}
.sh h2{max-width:16ch}.sh p{max-width:44ch}

/* journey */
.jr{display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.jr{grid-template-columns:repeat(3,minmax(0,1fr))}}
.jr .st{padding:clamp(20px,2.4vw,36px);border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:14px}
.jr .st .n{font-family:var(--display);font-size:60px;line-height:1;color:var(--gold);font-weight:400}
.jr .st q{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.3;quotes:none}
.jr .st b.cap{display:block;margin-bottom:8px}

/* try-on */
.tryon{display:grid;gap:clamp(22px,4vw,64px);grid-template-columns:minmax(0,1fr);align-items:center}
@media(min-width:940px){.tryon{grid-template-columns:minmax(0,.9fr) minmax(0,1fr)}}
.stage{position:relative;background:var(--surf2);display:grid;place-items:center;overflow:hidden;min-height:260px}
.stage canvas{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;touch-action:none;cursor:crosshair}
.stage .badge{position:absolute;left:12px;top:12px;font:600 10.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;background:rgba(9,9,10,.7);color:#F3EDE1;padding:7px 10px;backdrop-filter:blur(6px)}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:44px;height:44px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--rule);outline-offset:2px;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--bg);outline:2px solid var(--gold)}
.fam{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--rule);background:transparent;padding:11px 18px;font:500 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;display:inline-flex;gap:10px;align-items:center;transition:border-color .2s,background .2s}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.seg{display:inline-flex;border:1px solid var(--rule);flex-wrap:wrap}
.seg button{background:none;border:0;padding:11px 16px;font:500 12px var(--sans);letter-spacing:.1em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--on-gold)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs button{width:64px;height:80px;padding:0;border:2px solid transparent;overflow:hidden;background:var(--surf2);opacity:.7}
.thumbs button[aria-pressed="true"]{border-color:var(--gold);opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
input[type=range]{accent-color:var(--gold)}
.cmp{display:flex;align-items:center;gap:12px;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.cmp input{flex:1}
.note{font-size:13.5px;color:var(--mute);border-left:2px solid var(--gold);padding-left:14px;max-width:62ch}

/* facts and kv */
.facts{display:grid;border-top:1px solid var(--rule)}
.facts>div{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.9fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.facts>div>span:last-child{text-align:right;min-width:0;overflow-wrap:anywhere}
@media(max-width:600px){.facts>div{grid-template-columns:1fr;gap:4px}.facts>div>span:last-child{text-align:left}}
.kv{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.6fr);gap:0;margin:0;border-top:1px solid var(--rule)}
.kv dt,.kv dd{margin:0;padding:13px 0;border-bottom:1px solid var(--rule)}
.kv dt{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc-text);padding-right:14px;padding-top:17px}
.tag{display:inline-block;font:600 9.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;padding:3px 7px;border:1px solid currentColor;vertical-align:middle;margin-left:6px;opacity:.85}
.tag.v{color:var(--ok)}.tag.i{color:var(--warn)}.tag.r{color:var(--acc-text)}.tag.c{color:var(--concept);border-style:dashed}
.day{display:grid;border-top:1px solid var(--rule)}
.day>div{display:grid;grid-template-columns:minmax(0,.55fr) minmax(0,1.6fr);gap:20px;padding:16px 0;border-bottom:1px solid var(--rule)}
.day b{font-family:var(--display);font-weight:500;font-size:20px}
.pill-row{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--rule);padding:7px 14px;font:500 11.5px var(--sans);letter-spacing:.1em;text-transform:uppercase}

/* cards */
.card{border:1px solid var(--rule);background:var(--surf);padding:clamp(20px,2.4vw,32px);display:flex;flex-direction:column;gap:12px}
.pcard{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.pcard h3{font-size:24px}
.steps3{display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
@media(min-width:780px){.steps3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps3>div{padding:26px 24px 26px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
.steps3 .n{font-family:var(--display);font-size:44px;color:var(--gold);line-height:1}

/* voices */
.vq{display:grid;gap:clamp(16px,2vw,28px);grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.vq{grid-template-columns:repeat(3,minmax(0,1fr))}}
.q{border-top:1px solid var(--gold);padding-top:22px;display:flex;flex-direction:column;gap:18px;position:relative}
.q p{font-family:var(--display);font-size:clamp(20px,1.9vw,26px);line-height:1.3;font-style:italic;font-weight:400}
.q small{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stamp{align-self:flex-start;font:700 9.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;padding:4px 8px;border:1px dashed var(--concept);color:var(--concept)}
.proof{display:grid;gap:0;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:900px){.proof{grid-template-columns:repeat(4,minmax(0,1fr))}}
.proof>div{padding:22px 18px 22px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.proof .big{font-family:var(--display);font-size:clamp(44px,5vw,72px);line-height:1;color:var(--gold-text)}
.proof .big small{font-size:.38em;color:var(--mute);margin-left:4px}

/* quiz, booking */
.qz,.bk-wrap{max-width:900px;margin-inline:auto;padding-inline:var(--gut)}
.prog,.stepsbar{display:flex;gap:6px;margin-bottom:34px}
.prog i,.stepsbar i{flex:1;height:2px;background:var(--rule)}
.prog i.on,.stepsbar i.on{background:var(--gold)}
.opts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.opts .chip{font-size:13px;padding:15px 22px}
.rc{border:1px solid var(--rule);padding:clamp(20px,3vw,40px);display:flex;flex-direction:column;gap:16px;background:var(--surf)}
.rc.top{border-color:var(--gold)}
.res{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc-text)}
.field input,.field textarea{background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--ink);font:400 20px var(--sans);padding:12px 0;border-radius:0;width:100%}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--gold)}
.sum{border:1px solid var(--gold);padding:24px;background:var(--surf);font-size:18px;line-height:1.7}
.chat{display:flex;flex-direction:column;gap:10px;max-width:460px}
.msg{background:var(--surf2);padding:14px 16px;border-radius:2px 14px 14px 14px;font-size:15px}
.msg small{display:block;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--acc-text);margin-bottom:4px}
.loop{display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.loop{grid-template-columns:repeat(3,minmax(0,1fr))}}
.loop>div{padding:20px 20px 20px 0;border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.loop>div>b:first-child{font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--acc-text)}

/* FAQ */
.fq details{border-bottom:1px solid var(--rule)}
.fq summary{list-style:none;cursor:pointer;padding:22px 0;font-family:var(--display);font-size:clamp(20px,2vw,27px);display:flex;justify-content:space-between;gap:20px}
.fq summary::-webkit-details-marker{display:none}
.fq summary::after{content:"+";color:var(--gold);font-family:var(--sans);font-weight:300;font-size:26px;line-height:1}
.fq details[open] summary::after{content:"\2013"}
.fq details p{padding:0 0 24px;color:var(--mute);max-width:62ch}
.fq{border-top:1px solid var(--rule)}

/* page hero (inner pages) */
.ph-hero{position:relative;min-height:min(78vh,720px);display:flex;align-items:flex-end;color:#F3EDE1;overflow:hidden;isolation:isolate}
.ph-hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(1) brightness(.62) contrast(1.05)}
.ph-hero.colour>img{filter:brightness(.62)}
.ph-hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.1) 30%,rgba(0,0,0,.88))}
.ph-hero .in{padding-block:130px clamp(34px,6vw,76px);display:flex;flex-direction:column;gap:20px;width:100%}
.ph-hero h1{max-width:15ch}
.ph-hero .lead{color:rgba(243,237,225,.82)}
.crumb{font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:rgba(243,237,225,.7)}
.crumb a{text-decoration:none;border-bottom:1px solid rgba(243,237,225,.4)}
.mapbox{background:var(--surf);border:1px solid var(--rule);padding:10px}
.mapbox svg{width:100%;height:auto;display:block}

/* CTA band */
.cta{position:relative;isolation:isolate;overflow:hidden;color:#F3EDE1;text-align:left}
.cta>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;filter:grayscale(1) brightness(.4)}
.cta::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.25))}

/* footer */
.ft{border-top:1px solid var(--rule);padding-block:64px 120px;background:var(--bg)}
.ft .cols{display:grid;gap:36px;grid-template-columns:minmax(0,1fr)}
@media(min-width:860px){.ft .cols{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.ft h4{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--acc-text);margin-bottom:14px}
.ft a{display:block;text-decoration:none;padding:5px 0;color:var(--mute)}
.ft a:hover{color:var(--ink)}
.ft .fine{margin-top:44px;padding-top:22px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--mute);max-width:90ch}
@media(min-width:1040px){.ft{padding-bottom:64px}}

/* float bar */
.float{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:1px;background:var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--rule)}
.float .btn{min-height:56px;padding:0 6px;border:0;font-size:10.5px;letter-spacing:.1em}
.float .btn.sec{background:var(--bg);color:var(--ink)}
@media(min-width:1040px){.float{display:none}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:60;background:var(--ink);color:var(--bg);padding:14px 22px;font-size:14px;max-width:min(92vw,520px)}
.ribbon{background:var(--surf2);color:var(--mute);font:500 11.5px var(--sans);letter-spacing:.04em;text-align:center;padding:9px var(--gut);padding-top:calc(9px + env(safe-area-inset-top,0px));position:relative;z-index:60}
.hd{top:0}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.reel img.on{opacity:1}.bars i.on::after{transform:none}}

/* ---------- phone refinements ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
@media(max-width:779px){
  .blk{padding-block:52px}.blk.tight{padding-block:40px}

  .g4{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
  .g4 .stack{gap:10px!important}.g4 h3{font-size:17px;line-height:1.2}.g4 p{font-size:14px;line-height:1.45}

  .jr .st{padding:14px 0 16px;gap:8px}.jr .st .n{font-size:34px}.jr .st q{font-size:16px;line-height:1.3}.jr .st b.cap{margin-bottom:4px}
  .hero .scene{font-size:26px;line-height:1.15}
  .hero .scene #sl{display:block;margin:6px 0 0!important;font-size:15px!important;line-height:1.4}
  .tile::after{background:linear-gradient(transparent 30%,rgba(5,5,6,.92))}
  .tile b{font-size:18px}
  .float .btn{font-size:10px;letter-spacing:.05em;padding:0 4px}
  .ph-hero{min-height:min(70vh,560px)}
  .ph-hero .in{padding-block:104px 34px}
  .vq{gap:26px}
  .facts>div{padding-block:14px}
  .btn{min-height:52px}
  .row .btn,.row .link{max-width:100%}
}
@media(max-width:380px){
  :root{font-size:15px}
  .hero h1{font-size:42px}
  .logo{font-size:19px}.logo i{display:none}
  .jr{grid-template-columns:minmax(0,1fr)}
  .g4{grid-template-columns:minmax(0,1fr)}
}
